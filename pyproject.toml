[project]
name = "moodle-cli"
version = "0.1.0"
description = "A Python CLI for Moodle Web Services"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [
    { name = "Marc Alier", email = "marc.alier@upc.edu" },
    { name = "Juanan Pereira" },
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2.0",
    "rich>=13.0",
    "keyring>=25.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
# QR-image decoding for `moodle auth qr-login --image`. Not required if you pass
# the decoded moodlemobile:// URI yourself. On macOS the system Python may fail
# to load Homebrew's libzbar (SIP) — use a venv/uv Python with
# DYLD_FALLBACK_LIBRARY_PATH=/opt/homebrew/lib. See README "QR login".
qr = [
    "pyzbar>=0.1.9",
    "pillow>=10.0",
]

[project.scripts]
moodle = "moodle_cli.cli.main:cli"
moodle-readonly = "moodle_cli.cli.readonly:cli_readonly"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moodle_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["moodle_cli"]
mypy_path = "src"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
]
